name: Build DroidBridge Host

on:
  workflow_dispatch:
  push:
    branches: [app]
    paths:
      - 'app/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - '*.kts'
      - '*.properties'
      - 'gradlew*'
      - '.github/workflows/host.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build host APK
        
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: droidbridge-host
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
